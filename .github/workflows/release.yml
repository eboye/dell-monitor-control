name: Release

# Build the extension zip and attach it to a GitHub Release whenever a
# version tag (v1, v2, ...) is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pack.sh compiles the GSettings schema into the zip.
      - name: Install glib-compile-schemas
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev-bin

      - name: Build extension zip
        run: |
          bash scripts/pack.sh "dell-monitor-control@eboye.github.shell-extension.zip"

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dell-monitor-control@eboye.github.shell-extension.zip
          generate_release_notes: true
